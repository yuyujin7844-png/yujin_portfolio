name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build mini_sns
        working-directory: ./mini_sns
        run: |
          npm install
          npm run build

      - name: Build Bloom_Champagne
        working-directory: ./Bloom_Champagne
        run: |
          npm install
          npm run build

      - name: Build winter_foreste_market
        working-directory: ./winter_foreste_market
        run: |
          npm install
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p pages-dist
          cp deploy/index.html pages-dist/index.html
          cp -r mini_sns/dist pages-dist/mini_sns
          cp -r Bloom_Champagne/dist pages-dist/Bloom_Champagne
          cp -r winter_foreste_market/dist pages-dist/winter_foreste_market

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages-dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
